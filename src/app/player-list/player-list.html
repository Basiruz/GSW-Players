<h2>Players</h2>


<div class="cards">
  @for (player of players(); track player.id) {
    <app-player-card
      [firstName]="player.firstName"
      [lastName]="player.lastName"
      [age]="player.age"
      [jerseyNumber]="player.jerseyNumber"
      [photo]="player.photo"
      [stats]="player.stats">

    </app-player-card>
  } @empty {
    <p class="no-results">No players found.</p>
  }
</div>

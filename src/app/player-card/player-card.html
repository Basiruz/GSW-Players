<div class="player-card">
  <img [src]="photo" [alt]="firstName + ' ' + lastName">

  <h2>{{ firstName }} {{ lastName }}</h2>

  <p>Age: {{ age }} years</p>
  <p class="jersey-number">Jersey Number: #{{ jerseyNumber }}</p>

  <div class="stats-grid">
    @for (stat of statDefinitions; track stat.key) {
      <div class="stat" [class.highlighted]="highlightedStat === stat.key">

        <span class="stats-label tooltip">
          {{ stat.key }}

          <span class="tooltip-text">
            {{ stat.description }}
          </span>
        </span>

        <span class="stats-value">
          {{ stats[stat.key] }}
        </span>
      </div>
    }
  </div>
</div>
